---
- name: Zsh - Set platform specific variables
  ansible.builtin.set_fact:
    zsh_current_user_home_base: "{{ '/Users' if ansible_facts['os_family'] == 'Darwin' else '/home' }}"

- name: Zsh - Ensure user_home_base_dir is set
  ansible.builtin.set_fact:
    zsh_user_home_base_dir: "{{ zsh_user_home_base_dir | default(zsh_current_user_home_base) }}"

- name: Zsh - download oh-my-zsh installer
  become: true
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh-install.sh
    mode: '0755'
- name: Zsh - install oh-my-zsh
  become: true
  become_user: "{{ item.username }}"
  ansible.builtin.command:
    cmd: /tmp/ohmyzsh-install.sh --unattended
    creates: "{{ zsh_user_home_base_dir }}/{{ item.username }}/.oh-my-zsh"
  loop: "{{ users }}"
- name: Zsh - cloning powerlevel10k
  become: true
  become_user: "{{ item.username }}"
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ zsh_user_home_base_dir }}/{{ item.username }}/.oh-my-zsh/custom/themes/powerlevel10k"
  loop: "{{ users }}"
- name: Zsh - Generate ~.zshrc
  become: true
  ansible.builtin.template:
    mode: '0644'
    src: zshrc.j2
    owner: "{{ item.username }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else item.username }}"
    dest: "{{ zsh_user_home_base_dir }}/{{ item.username }}/.zshrc"
  loop: "{{ users }}"
- name: Zsh - add zsh as default shell to the user
  become: true
  ansible.builtin.user:
    name: "{{ item.username }}"
    shell: /bin/zsh
  loop: "{{ users }}"
