---
- name: Java - Linux installation
  become: true
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Java - install packages
      ansible.builtin.dnf:
        name: "{{ java_packages | default(['java-25-openjdk-devel']) }}"
        state: present
        update_cache: true

    - name: Java - download gradle
      ansible.builtin.get_url:
        url: "https://services.gradle.org/distributions/gradle-{{ java_gradle_version }}-bin.zip"
        dest: "/tmp/gradle-{{ java_gradle_version }}-bin.zip"
        mode: '0644'

    - name: Java - create gradle directory
      ansible.builtin.file:
        path: /opt/gradle
        state: directory
        mode: '0755'

    - name: Java - extract gradle
      ansible.builtin.unarchive:
        src: "/tmp/gradle-{{ java_gradle_version }}-bin.zip"
        dest: /opt/gradle
        remote_src: true
        creates: "/opt/gradle/gradle-{{ java_gradle_version }}"

    - name: Java - find old gradle versions
      ansible.builtin.find:
        paths: /opt/gradle
        file_type: directory
        patterns: 'gradle-*'
        excludes: "gradle-{{ java_gradle_version }}"
      register: java_old_gradle_versions

    - name: Java - remove old gradle versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ java_old_gradle_versions.files }}"
      when: java_cleanup_old_gradle | default(false)

    - name: Java - create active symlink
      ansible.builtin.file:
        src: "/opt/gradle/gradle-{{ java_gradle_version }}"
        dest: /opt/gradle/active
        state: link

    - name: Java - setup environment variables
      ansible.builtin.copy:
        dest: /etc/profile.d/java.sh
        content: |
          export JAVA_HOME=/etc/alternatives/java_sdk
          case ":${PATH}:" in
              *:/opt/gradle/active/bin:*) ;;
              *) export PATH="/opt/gradle/active/bin:${PATH}" ;;
          esac
        mode: '0644'

- name: Java - macOS installation
  when: ansible_facts['os_family'] == 'Darwin'
  block:
    - name: Java - install OpenJDK and Gradle via Homebrew
      community.general.homebrew:
        name:
          - openjdk@25
          - gradle
        state: present

    - name: Java - symlink openjdk for macOS
      become: true
      ansible.builtin.file:
        src: "/opt/homebrew/opt/openjdk@25/libexec/openjdk.jdk"
        dest: "/Library/Java/JavaVirtualMachines/openjdk-25.jdk"
        state: link
