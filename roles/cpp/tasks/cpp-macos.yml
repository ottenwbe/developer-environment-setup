---
- name: Cpp - install packages on macOS
  community.general.homebrew:
    name: "{{ (cpp_macos_default_packages + cpp_packages) | unique if cpp_install_defaults | bool else cpp_packages }}"
    state: present

- name: Cpp - install OpenGL development packages on macOS
  community.general.homebrew:
    name: "{{ cpp_opengl_packages_macos }}"
    state: present
  when: cpp_install_opengl | bool

