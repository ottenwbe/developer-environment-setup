name: Renovate Bot

on:
  # schedule:
    # Run every day at 03:00 UTC to check for updates
    # - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # Required for Dependency Dashboard and other issue-related actions
  security-events: write # Required to access vulnerability alerts

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.3
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}

      - name: Generate Report Summary
        if: always()
        run: |
          echo "### 🤖 Renovate Bot Run" >> $GITHUB_STEP_SUMMARY
          echo "Renovate has finished checking for updates." >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ The run was successful. Check your **Pull Requests** for any updates." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ The run failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "#### What was checked:" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Actions**: Standard actions like \`actions/checkout\` and \`renovatebot/github-action\`" >> $GITHUB_STEP_SUMMARY
